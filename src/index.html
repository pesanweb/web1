<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Berbagi Cerita Mengasuh Anak</title>
</head>

<body>
    <div id="app-shell">
        <div id="loader" aria-hidden="true">
            <div class="animate-spin rounded-full h-12 w-12 border-b-4 border-blue-600"></div>
        </div>

        <header class="bg-white shadow-md sticky top-0 z-50">
            <div class="container mx-auto px-6 h-20 flex justify-between items-center">
                <a href="#/" class="brand-name text-2xl font-bold text-blue-700">Orang Muda</a>
                <nav class="hidden md:block">
                    <ul class="flex space-x-8 font-semibold items-center">
                        <li><a href="#/" class="hover:text-blue-600 text-pink-500">Beranda</a></li>
                        <li><a href="#/about" class="hover:text-blue-600 text-pink-500">About</a></li>
                        <li><a href="#/stories" class="hover:text-blue-600 text-pink-500">Stories</a></li>
                        <li><a href="#/add-story" class="hover:text-blue-600 text-pink-500">Add Story</a></li>
                        <li><button id="logout-button"
                                class="bg-pink-500 text-white px-5 py-2 rounded-lg hover:bg-pink-600 transition-colors">Login</button>
                        </li>
                    </ul>
                </nav>
                <button id="drawer-button" class="md:hidden text-3xl p-2" aria-label="Buka Menu">☰</button>
            </div>
        </header>

    </div>

    <div id="drawer-overlay" class="drawer-overlay"></div>
    <nav id="navigation-drawer"
        class="navigation-drawer fixed top-0 left-0 h-full w-64 bg-white shadow-2xl -translate-x-full md:hidden">
        <div class="p-6">
            <button id="close-drawer" class="text-2xl mb-8">✕</button>
            <ul class="space-y-6 text-lg font-semibold">
                <li><a href="#/" class="block text-pink-500">Beranda</a></li>
                <li><a href="#/about" class="block text-pink-500">About</a></li>
                <li><a href="#/stories" class="block text-pink-500">Stories</a></li>
                <li><a href="#/add-story" class="block text-pink-500">Add Story</a></li>
                <li><button id="logout-button-mobile" class="block text-pink-500 w-full text-left">Login</button>
                </li>
            </ul>
        </div>
    </nav>

    <main id="main-content" class="min-h-[80vh]"></main>

    <footer class="bg-gray-900 text-white py-8 mt-12 text-center">
        <p class="font-bold">Tim Konsultan Keluarga</p>
    </footer>
</body>

</html>
